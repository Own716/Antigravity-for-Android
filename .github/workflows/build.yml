name: Build OwnAgy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布为 Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and sign both editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Read version
        id: ver
        run: |
          . config/app.env
          echo "name=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building OwnAgy $APP_VERSION_NAME ($APP_VERSION_CODE)"

      - name: Build standard edition
        run: bash build.sh

      - name: Build region-bypass edition
        run: bash build.sh --region-bypass

      - name: Sign with the release key (from Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          V="${{ steps.ver.outputs.name }}"
          apksigner sign --ks "$RUNNER_TEMP/release.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "OwnAgy-$V-standard.apk" dist/antigravity.apk
          apksigner sign --ks "$RUNNER_TEMP/release.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "OwnAgy-$V-region-bypass.apk" dist/antigravity-region-bypass.apk
          rm -f "$RUNNER_TEMP/release.p12"
          apksigner verify --print-certs "OwnAgy-$V-standard.apk" | head -3
          sha256sum "OwnAgy-$V-standard.apk" "OwnAgy-$V-region-bypass.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ownagy-${{ steps.ver.outputs.name }}
          path: |
            OwnAgy-*.apk
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: OwnAgy ${{ steps.ver.outputs.name }}
          make_latest: true
          files: |
            OwnAgy-*.apk
            SHA256SUMS.txt
          body: |
            OwnAgy ${{ steps.ver.outputs.name }}（官方核心 2.33.0）

            | 文件 | 说明 |
            | :--- | :--- |
            | `OwnAgy-${{ steps.ver.outputs.name }}-region-bypass.apk` | 绕区版 |
            | `OwnAgy-${{ steps.ver.outputs.name }}-standard.apk` | 标准版 |
            | `SHA256SUMS.txt` | 校验和 |

            与旧版本签名一致，可直接覆盖安装.
